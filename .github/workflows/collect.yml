name: Collect Fuego bulletin

# INSIVUMEH publishes the daily bulletin between roughly 06:00 and 08:00 local
# (UTC-6), so 14:30 UTC gives it a comfortable margin. A second run in the
# evening catches days when publication slips.
on:
  schedule:
    - cron: '30 14 * * *'
    - cron: '30 23 * * *'
  workflow_dispatch:
    inputs:
      bulletin_url:
        description: 'Fetch this exact URL instead of discovering one'
        required: false
        type: string
      gvp_backfill:
        description: 'Fetch every Smithsonian GVP weekly report since the first bulletin, not just the last four weeks'
        required: false
        type: boolean
        default: false

# Only one collector at a time; concurrent runs would race on the commit.
concurrency:
  group: collect-bulletin
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # A stalled download should not hold a runner for the 6-hour default.
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      # The token is not left in .git/config while third-party PDFs are read
      # and dependencies install; only the commit step below uses it.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # The bulletins are scans with no text layer, so collection needs OCR.
      - name: Install OCR tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-spa

      - run: npm ci

      # The parser guards the archive's integrity — don't write with a broken one.
      - name: Test parser
        run: npm test

      - name: Collect today's bulletin
        run: npm run collect
        env:
          BULLETIN_URL: ${{ inputs.bulletin_url }}

      # A slipped day is caught the next morning: if today's run found nothing
      # new, look at yesterday (a no-op when it is already archived).
      - name: Retry yesterday if nothing new
        if: ${{ inputs.bulletin_url == '' }}
        run: |
          if [ -z "$(git status --porcelain data/bulletins/)" ]; then
            YESTERDAY=$(date -u -d '-30 hours' +%Y-%m-%d)
            npm run backfill -- --from "$YESTERDAY" --to "$YESTERDAY"
          fi

      # Smithsonian GVP's weekly report on Fuego, kept beside the bulletins as a
      # cross-check. Idempotent: weeks already stored are skipped, and a week GVP
      # has not published is a warning, never a failure.
      - name: Collect Smithsonian GVP weekly reports
        env:
          GVP_BACKFILL: ${{ inputs.gvp_backfill }}
        run: |
          if [ "$GVP_BACKFILL" = 'true' ]; then
            npx tsx scripts/gvp.ts
          else
            npx tsx scripts/gvp.ts --recent
          fi

      - name: Commit archive
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          branch="$(git rev-parse --abbrev-ref HEAD)"
          git config user.name  'fuego-collector[bot]'
          git config user.email 'fuego-collector[bot]@users.noreply.github.com'
          git add data/
          if git diff --staged --quiet; then
            echo 'No new bulletin data today.'
            exit 0
          fi
          git commit -m "data: Fuego bulletin $(date -u -d '-6 hours' +%Y-%m-%d)"
          # The scheduled run may race with a push to the branch; rebase and retry.
          for attempt in 1 2 3 4; do
            if git push "$remote" "HEAD:$branch"; then
              exit 0
            fi
            echo "Push failed (attempt $attempt), rebasing..."
            sleep $((2 ** attempt))
            git pull --rebase --autostash "$remote" "$branch" || true
          done
          echo 'Could not push collected data.'
          exit 1
